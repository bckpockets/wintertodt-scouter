name: Verify plugin and service
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 4'
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew --no-daemon test jar testClientZip
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-jar-and-tests
          path: |
            build/libs/*.jar
            build/reports/tests/test/
      - uses: actions/upload-artifact@v4
        with:
          name: wintertodt-scouter-test-client
          path: build/distributions/wintertodt-scouter-test-client.zip
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
        working-directory: service
      - run: npm test
        working-directory: service
      - run: npm run check:worker
        working-directory: service
      - run: docker build -t wintertodt-scouter:test service
      - run: SCOUTER_DOMAIN=scouter.example.org docker compose -f service/compose.yaml config --quiet
      - run: docker run --rm -e SCOUTER_DOMAIN=scouter.example.org -v "$PWD/service/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
