plugins {
    id 'java'
}

repositories {
    maven { url = 'https://repo.runelite.net'; content { includeGroupByRegex('net\\.runelite.*') } }
    mavenCentral()
}

def runeLiteVersion = 'latest.release'
dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
}
group = 'com.wintertodt.scouter'
version = '2.0.0'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}
tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.wintertodt.scouter.WintertodtScouterPluginTest'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

// Argument file for a detached desktop launch; contains classpath only, never account credentials.
tasks.register('writeRunArgs') {
    dependsOn testClasses
    doLast {
        def classpath = sourceSets.test.runtimeClasspath.asPath.replace('\\', '/')
        file("${buildDir}/runelite.args").text = "-ea\n-cp\n\"${classpath}\"\ncom.wintertodt.scouter.WintertodtScouterPluginTest\n--developer-mode\n"
    }
}

// Standalone development client for human testing, separate from the Plugin Hub plugin JAR.
tasks.register('testClientJar', Jar) {
    dependsOn testClasses
    archiveFileName.set('wintertodt-scouter-test-client.jar')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes('Main-Class': 'com.wintertodt.scouter.WintertodtScouterPluginTest', 'Multi-Release': true) }
    from sourceSets.main.output
    from(sourceSets.test.output) { include 'com/wintertodt/scouter/WintertodtScouterPluginTest.class' }
    from { configurations.testRuntimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/INDEX.LIST', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', '**/module-info.class'
}

tasks.register('testClientZip', Zip) {
    dependsOn testClientJar
    archiveFileName.set('wintertodt-scouter-test-client.zip')
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))
    from(tasks.named('testClientJar'))
    from('testing/START.cmd')
    from('testing/TESTING.md')
    from('LICENSE')
    from('NOTICE')
}
